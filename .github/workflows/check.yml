name: check
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: if [ -f server/requirements.txt ]; then python -m pip install -r server/requirements.txt; fi
      - run: bash tools/check.sh
