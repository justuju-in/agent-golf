<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – Agent Golf</title>
  <link rel="stylesheet" href="/static/style.css">
{%- block head %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>
  <header class="site-header">
    <div class="wrap">
      <span class="site-name"><span class="prompt" aria-hidden="true">&gt; </span>agent-golf<span class="cursor" aria-hidden="true">_</span></span>
      {#- Every board sets active_page. #}
      <nav aria-label="Main">
        <a href="/"{% if active_page == "board" %} aria-current="page"{% endif %}>Board</a>
        <a href="/rules"{% if request.url.path == "/rules" %} aria-current="page"{% endif %}>Rules</a>
        <a href="/register"{% if request.url.path == "/register" %} aria-current="page"{% endif %}>Register</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
{% block main %}{% endblock %}
  </main>
{% block scripts %}{% endblock %}
</body>
</html>
